# Render Blueprint Configuration (render.yaml)
# This file automates deployment of the ReeferON CRM monorepo as a single Web Service on Render.
# For details on Render blueprints, visit: https://render.com/docs/blueprints

services:
  - type: web
    name: reeferon-crm
    env: node
    plan: free
    # Root directory is the repository root
    rootDir: .
    # Build Command: Installs root, frontend, and backend packages, then builds the frontend
    buildCommand: npm install && npm install --prefix frontend && npm install --prefix backend && npm run build --prefix frontend
    # Start Command: Starts the combined server (Express backend serving static frontend)
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ReeferON <onboarding@resend.dev>
      # SMTP disabled — use Resend on Render
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      - key: APP_LOGIN_URL
        sync: false
      - key: LOG_ALL_STATUS
        value: "0"
